# Secrets come from environment variables or a git-ignored .env file (see .env.example)
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
spring.application.name=StockManagement
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Swagger / OpenAPI disabled by default (production). Enable with profile: spring.profiles.active=dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework=INFO
logging.level.vector.spring_boot_sec_vieira=INFO
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
spring.web.cors.allowed-origins=${SPRING_WEB_CORS_ALLOWED_ORIGINS:https://sales.rw}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.from=${SPRING_MAIL_USERNAME:}
spring.mail.properties.mail.smtp.writetimeout=5000



# Platform operator created on an empty database (no public sign-up exists)
app.bootstrap.super-admin-email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin-password=${SUPER_ADMIN_PASSWORD:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
